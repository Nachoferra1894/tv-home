<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Home</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0e14; color:#e8eaf0;
    font-family:"Segoe UI","Arial",sans-serif; }
  .bg { position:fixed; inset:0;
    background:radial-gradient(1200px 700px at 75% 20%, #1b2337 0%, #0b0e14 60%); }
  .wrap { position:relative; z-index:2; padding:56px 72px; height:100%;
    display:flex; flex-direction:column; }
  #clock { font-size:120px; font-weight:200; letter-spacing:2px; line-height:1; }
  #date { font-size:26px; color:#9aa3b5; margin-top:10px; }
  #weather { font-size:24px; color:#9aa3b5; margin-top:8px; min-height:30px; }
  .row { margin-top:auto; margin-bottom:24px; display:flex; gap:26px; align-items:flex-end; }
  .tile { width:230px; height:150px; border-radius:18px; border:3px solid transparent;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    background:linear-gradient(160deg,#1a2130,#12161f); cursor:pointer;
    transition:transform .15s ease, border-color .15s ease; }
  .tile.focus { border-color:#7aa2ff; transform:scale(1.06); }
  .tile .logo { font-size:30px; font-weight:700; letter-spacing:1px; }
  .tile .sub { font-size:14px; color:#8a93a6; }
  .n .logo { color:#e50914; } .p .logo { color:#00a8e1; }
  .d .logo { color:#1b6ec2; } .y .logo { color:#ff0033; }
  .b .logo { color:#9aa3b5; font-size:24px; }
  .hint { font-size:16px; color:#5b6373; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div id="clock">--:--</div>
  <div id="date"></div>
  <div id="weather"></div>
  <div class="row" id="row"></div>
  <div class="hint">◄ ► to move · OK to open</div>
</div>
<script>
var APPS = [
  { name:"Netflix",      cls:"n", logo:"NETFLIX",   cmd:"netflix" },
  { name:"Prime Video",  cls:"p", logo:"prime video", cmd:"amazon" },
  { name:"Disney+",      cls:"d", logo:"Disney+",   cmd:"https://cd-dmgz.bamgrid.com/bbd/hisense_tv/index.html" },
  { name:"YouTube",      cls:"y", logo:"YouTube",   cmd:"youtube" },
  { name:"Browser",      cls:"b", logo:"Browser",   cmd:"browser" }
];

var row = document.getElementById("row");
var focus = 0;
APPS.forEach(function (a, i) {
  var d = document.createElement("div");
  d.className = "tile " + a.cls;
  d.innerHTML = '<div class="logo">' + a.logo + '</div><div class="sub">' + a.name + '</div>';
  d.onclick = function () { launch(i); };
  row.appendChild(d);
});
function paint() {
  var t = row.children;
  for (var i = 0; i < t.length; i++) t[i].className = "tile " + APPS[i].cls + (i === focus ? " focus" : "");
}
function launch(i) {
  try { Hisense_StartApp(APPS[i].cmd); } catch (e) { }
}
function move(d) { focus = (focus + d + APPS.length) % APPS.length; paint(); }
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight" || e.keyCode === 39) move(1);
  else if (e.key === "ArrowLeft" || e.keyCode === 37) move(-1);
  else if (e.key === "Enter" || e.keyCode === 13) launch(focus);
});
paint();

function tick() {
  var n = new Date();
  var h = n.getHours(), m = n.getMinutes();
  if (h < 10) h = "0" + h; if (m < 10) m = "0" + m;
  document.getElementById("clock").textContent = h + ":" + m;
  var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var mons = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("date").textContent = days[n.getDay()] + ", " + n.getDate() + " " + mons[n.getMonth()];
}
tick(); setInterval(tick, 5000);

// weather: open-meteo, no key needed (London as default; pass ?lat=&lon= to override)
var q = location.search.match(/lat=([-\d.]+).*lon=([-\d.]+)/);
var lat = q ? q[1] : 51.5074, lon = q ? q[2] : -0.1278;
fetch("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&current=temperature_2m,weather_code&timezone=auto")
  .then(function (r) { return r.json(); })
  .then(function (j) {
    var c = j.current.temperature_2m;
    document.getElementById("weather").textContent = Math.round(c) + "°C outside";
  })
  .catch(function () { document.getElementById("weather").textContent = ""; });
</script>
</body>
</html>
